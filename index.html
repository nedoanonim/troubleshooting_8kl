if(run.phase==='repair')return `<div class="step-title">КРОК 4 · ПЛАН УСУНЕННЯ</div><p>Обери дію, яка справді вирішує проблему і не загрожує даним чи безпеці людини.</p><div class="choices">${c.fixes.map((x,i)=>`<button class="choice" data-repair="${i}"><span class="bullet">${i+1}</span>${clean(x)}</button>`).join('')}</div>${feedbackBox()}`;
if(run.phase==='verify')return `<div class="step-title">КРОК 4 · КОНТРОЛЬ ЯКОСТІ</div><div class="activity success">✓ Дію обрано правильно. ${c.service?'Тепер перевір реєстрацію передачі заявки фахівцю.':'Тепер потрібно переконатися, що проблема усунута.'}</div><p>${c.service?'Пристрій не можна запускати до огляду фахівцем. Перейди до інструмента':'Перейди до інструмента'} <b>${toolName(c.verify)}</b> і ${c.service?'підтвердь реєстрацію та безпечну передачу заявки':'виконай повторне контрольне тестування'}. Без цього роботу не можна вважати завершеною.</p>${feedbackBox()}`;
return `<div class="step-title">${c.service?'ЗАЯВКУ БЕЗПЕЧНО ПЕРЕДАНО':'ЗАЯВКУ УСПІШНО ЗАКРИТО'}</div><p>${c.service?'Несправність локалізовано, пристрій зупинено та передано фахівцю. Фізичний ремонт ще не виконано.':'Систему діагностовано, причину знайдено, безпечне рішення застосовано, результат перевірено.'}</p><div class="activity success">Підсумкова оцінка: <b>${grade(run.score)} / 12</b> · ${run.score}%</div><button class="btn primary" data-action="result">🏆 Переглянути інженерний звіт</button>${idx<scenarios.length-1?`<button class="btn secondary" style="margin-top:8px;width:100%" data-action="next">Наступна заявка →</button>`:''}`}
function feedbackBox(){return run.feedback?`<div class="activity ${run.feedbackType==='bad'?'error':run.feedbackType==='good'?'success':''}">${clean(run.feedback)}</div>`:''}
function actTriage(v){if(run.phase!=='triage')return;if(v===scenario().category){run.classification=true;run.phase='investigate';run.feedback='Вірно! Тепер знайди докази, використовуючи діагностику.';run.feedbackType='good';audit('Первинну категорію визначено правильно.');tone('good')}else{run.cost+=8;run.wrongDiagnoses++;respond('Це не найточніша категорія. Зважай на опис симптомів та спробуй ще раз. −8 балів','bad');audit('Невдала первинна оцінка (−8).');tone('bad')}draw()}
function actTool(t){activeTool=t;run.feedback='';run.feedbackType='';draw()}
function scan(){if(scanBusy||['triage','done'].includes(run.phase))return;const c=scenario(),tool=activeTool;if(tool==='settings'&&pathStep<5){showToast('У параметрах Windows спочатку відкрий послідовно всі розділи.','bad');return}const valid=tool!=='network'||!c.adapter||adapter===c.adapter;
scanBusy=true;const btn=document.querySelector('[data-action="scan"]');if(btn){btn.disabled=true;btn.innerHTML=`${ico('activity',14)} ПЕРЕВІРЯЄМО...`}
setTimeout(()=>{scanBusy=false;if(!run||c.id!==scenario().id)return;let counted=!!run.scanned[tool];run.scanned[tool]=true;run.lastTool=tool;run.lastAdapter=adapter;if(run.phase==='verify'){
if(tool===c.verify&&valid){run.validation=true;run.phase='done';run.doneAt=Date.now();run.score=scoreNow();let best=store.best[c.id];if(!best||run.score>best.score)store.best[c.id]={score:run.score,grade:grade(run.score),at:now(),duration:seconds(Math.round((run.doneAt-run.started)/1000))};store.attempts[c.id]=(store.attempts[c.id]||0)+1;persist();audit(c.service?'Безпечну передачу фахівцю підтверджено. Заявку закрито.':'Контрольний тест успішно пройдено. Заявку закрито.');tone('win');draw();openResult();return}else{if(!counted){run.cost+=2;run.wrongTest++}respond('Для підтвердження виправлення потрібна повторна перевірка інструментом «'+toolName(c.verify)+'».','bad');audit('Обрано нецільову контрольну перевірку.');draw();return}}
if(tool==='network'&&!valid){run.scanned[tool]=false;respond('Вибраний адаптер '+adapter+' не показав причину проблеми. Спробуй інший тип підключення.','bad');audit('Перевірено не той мережний адаптер.');draw();return}
if(tool===c.primary||tool===c.secondary){if(!run.evidence.includes(tool)){run.evidence.push(tool);audit('Отримано доказ: '+toolName(tool)+'.');tone('good')}else{audit('Повторна перевірка: '+toolName(tool)+'.')}run.feedback='Зафіксовано результат перевірки «'+toolName(tool)+'». '+(run.evidence.length===2?'Доказів достатньо для діагнозу.':'Потрібен ще один незалежний доказ.');run.feedbackType='good';if(run.evidence.length===2)run.phase='diagnose'}else{if(!counted){run.cost+=2;run.wrongTest++}run.feedback='Цей інструмент не виявив причину поточного збою. Спробуй перевірити іншу складову.';run.feedbackType='';audit('Перевірка '+toolName(tool)+': без суттєвих аномалій.')}draw()},620)}
function actDiagnosis(i){if(run.phase!=='diagnose')return;if(+i===scenario().cause){run.phase='repair';run.correctDiagnosis=true;run.feedback='Діагноз підтверджено двома перевірками. Визнач безпечне рішення.';run.feedbackType='good';audit('Причину встановлено правильно.');tone('good')}else{run.cost+=12;run.wrongDiagnoses++;run.feedback='Цей висновок не узгоджується з діагностичними даними. Перечитай знайдені докази. −12 балів.';run.feedbackType='bad';audit('Помилка у визначенні причини (−12).');tone('bad')}draw()}
function actRepair(i){if(run.phase!=='repair')return;const c=scenario();if(+i===c.repair){run.phase='verify';run.repaired=true;run.feedback='Рішення прийнято. Тепер контрольне тестування підтвердить результат.';run.feedbackType='good';audit('Безпечну коригувальну дію обрано.');tone('good')}else{let unsafe=(c.unsafe||[]).includes(+i),cut=unsafe?20:14;run.cost+=cut;run.wrongRepairs++;run.feedback=(unsafe?'НЕБЕЗПЕЧНА ДІЯ! У реальному кабінеті так робити не можна.':'Це не усуне встановлену несправність.')+' −'+cut+' балів. Обери інший спосіб.';run.feedbackType='bad';audit('Неправильне рішення (−'+cut+').');tone('bad')}draw()}
function hint(){if(run.phase==='done')return;let ph=run.phase,c=scenario();if(run.hintPhases.includes(ph)){showToast('Підказку для цього етапу вже відкрито.');return}run.hintPhases.push(ph);run.cost+=6;let tip=ph==='triage'?`Подумай, що саме не працює: фізичний компонент, налаштування/програма, підключення чи захист.`:ph==='investigate'?`Корисно перевірити «${toolName(c.primary)}» і «${toolName(c.secondary)}». ${c.adapter?'Вибери адаптер '+c.adapter+'.':''}`:ph==='diagnose'?`Порівняй ці ознаки: ${c.signals[c.primary][0]}. ${c.signals[c.secondary][0]}.`:ph==='repair'?c.lesson:`Перезапусти діагностику інструментом «${toolName(c.verify)}».`;respond('Підказка: '+tip+' (−6 балів)','');audit('Використано підказку для етапу «'+ph+'».');draw()}
function updateClock(){let e=document.getElementById('runtime');if(e&&run){let end=run.doneAt||Date.now();e.textContent=seconds(Math.floor((end-run.started)/1000))}}
function tone(k){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(k==='bad'?220:520,a.currentTime);if(k==='win')o.frequency.linearRampToValueAtTime(800,a.currentTime+.16);g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.start();o.stop(a.currentTime+.2);setTimeout(()=>a.close(),420)}catch(e){}}
function modal(html){document.getElementById('modal').innerHTML=html?`<div class="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`:'';dialog=html?'open':'';let b=document.querySelector('.modal button, .modal input');b?.focus()}
function start(){modal(`<div class="eyebrow">ЛАБОРАТОРІЯ ЦИФРОВОГО РЯТУВАННЯ · 8 КЛАС</div><h2>🛠️ Приймай виклики. Знаходь збої. Рятуй комп’ютери.</h2><p>Ти — інженер служби підтримки SYSTEM RESCUE. Тут не буде випадкових тестових відповідей: перед тобою реальні за логікою ситуації, інструменти Windows, діагностика POST, журнали помилок, мережні адаптери та несправні пристрої.</p><div class="modal-points"><div class="modal-point"><b>🧩 12 випадків</b>Від збою клавіатури до критичного стану диска.</div><div class="modal-point"><b>🔍 4 етапи</b>Класифікація → докази → діагноз → ремонт і перевірка.</div><div class="modal-point"><b>🏆 12 балів</b>Бали за уважність, безпеку та правильні рішення.</div></div><label class="field-label" for="username">Ім’я та прізвище інженера</label><input id="username" maxlength="60" placeholder="Наприклад: Марія Петренко" value="${clean(store.name)}"><div class="modal-actions"><button class="btn primary" data-action="begin">▶ Розпочати чергування</button></div><p style="font-size:10px;margin-top:14px">Це <b>імітація Windows</b>, а не справжня діагностика твого ПК. Жодні пристрої чи файли не змінюються, інтернет не потрібен.</p>`)}
function openTheory(){modal(`<button class="cross" data-action="close">×</button><div class="eyebrow">КИШЕНЬКОВИЙ ДОВІДНИК</div><h2>📚 Інструменти комп’ютерного діагноста</h2><div class="detailbox" style="line-height:1.95"><b>POST (Power On Self Test)</b> — самоперевірка базових апаратних компонентів під час ввімкнення. Критичні помилки потребують усунення до подальшої роботи.<br><b>Засіб усунення неполадок Windows:</b> Пуск → Параметри → Система → Виправити неполадки → Інші засоби усунення неполадок (вигляд може відрізнятися залежно від версії Windows).<br><b>Ethernet / Wi-Fi / Bluetooth</b> — різні адаптери, слід досліджувати відповідне з’єднання.<br><b>Диспетчер пристроїв</b> — стан компонентів і драйверів. <b>Диспетчер завдань</b> — процеси та використання ресурсів.<br><b>Журнал подій</b> — записи про збої та попередження.<br><b>SMART</b> — дані самодіагностики накопичувача (не завжди виявляють усі відмови).<br><b>AIDA64, CPU-Z, SiSoftware Sandra</b> — приклади програм для відомостей про апаратне забезпечення; <b>ESET</b> — приклад засобу захисту.<br><b>Безпека:</b> зберігай дані, не відкривай корпус під напругою, складні й ризикові втручання передавай відповідальному фахівцю.</div><div class="modal-actions"><button class="btn primary" data-action="close">Повернутися до справи</button></div>`)}
function openResult(){let c=scenario(),time=seconds(Math.round((run.doneAt-run.started)/1000)),best=store.best[c.id];modal(`<div class="eyebrow">CASE CLOSED · ЗАЯВКА ${idx+1}</div><div class="grade"><div><h2>${run.score>=90?(c.service?'🏆 Заявку безпечно передано фахівцю!':'🏆 Блискуча робота, інженере!'):run.score>=65?(c.service?'✅ Ризик локалізовано!':'✅ Збій усунено!'):'🛠️ Діагностику завершено. Є над чим попрацювати.'}</h2><p>${clean(store.name||'Юний діагност')}, ти пройшов шлях: від симптомів до ${c.service?'безпечної передачі обладнання фахівцю':'повторної перевірки'}.</p></div><div class="grade-number"><strong>${grade(run.score)}</strong><small>із 12 балів</small></div></div><div class="summary-grid"><div><b>${run.score}%</b><small>Якість діагностики</small></div><div><b>${time}</b><small>Час роботи</small></div><div><b>${run.evidence.length}/2</b><small>Докази</small></div></div><div class="result-note"><b>Проблема:</b> ${clean(c.title)}<br><b>${c.service?'Безпечний протокол':'Рішення'}:</b> ${clean(c.resolved)}<br><b>Важливо:</b> ${clean(c.lesson)}</div><ul class="report-list"><li>Непотрібних перевірок: ${run.wrongTest}</li><li>Хибних діагнозів / класифікацій: ${run.wrongDiagnoses}</li><li>Неправильних дій: ${run.wrongRepairs}</li><li>Використано підказок: ${run.hintPhases.length}</li><li>Найкращий результат: <b>${best?best.grade+'/12':'—'}</b></li></ul><div class="modal-actions"><button class="btn primary" data-action="next">${idx===scenarios.length-1?'↩ Повернутися до першої заявки':'Наступна заявка →'}</button><button class="btn secondary" data-action="download">⬇️ Зберегти звіт TXT</button><button class="btn secondary" data-action="print">🖨️ Друк</button><button class="btn secondary" data-action="close">Закрити</button></div>`)}
function openReport(){let done=countDone(),grades=Object.values(store.best).map(x=>x.grade),avg=grades.length?Math.round(grades.reduce((a,b)=>a+b,0)/grades.length*10)/10:'—';modal(`<button class="cross" data-action="close">×</button><div class="eyebrow">SYSTEM RESCUE · КАРТА КАР’ЄРИ</div><h2>📊 Журнал інженера ${clean(store.name||'Юний діагност')}</h2><p>Збережено на цьому комп’ютері. Заявки можна перегравати й покращувати свій найкращий бал.</p><div class="summary-grid"><div><b>${done} / 12</b><small>Виконано</small></div><div><b>${avg}</b><small>Середній бал</small></div><div><b>${badgeScore()} XP</b><small>Інженерний досвід</small></div></div><table class="report-table"><thead><tr><th>Заявка</th><th>Спроб</th><th>Найкраще</th></tr></thead><tbody>${scenarios.map((c,i)=>`<tr><td>${i+1}. ${c.emoji} ${clean(c.title)}</td><td>${store.attempts[c.id]||0}</td><td>${store.best[c.id]?store.best[c.id].grade+'/12':'—'}</td></tr>`).join('')}</tbody></table>${done===scenarios.length?`<div class="certificate"><div>⬡ SYSTEM RESCUE ⬡</div><h3>СЕРТИФІКАТ ЦИФРОВОГО РЯТІВНИКА</h3><p>Нагороджується <b>${clean(store.name||'Юний інженер')}</b><br>за успішне проходження 12 діагностичних місій.</p><div style="font-size:29px;font-weight:1000;color:#215f67">${avg} / 12</div><small>Діагностика апаратної та програмної складової комп’ютера</small></div>`:''}<div class="modal-actions"><button class="btn primary" data-action="downloadall">⬇️ Завантажити журнал</button><button class="btn secondary" data-action="print">🖨️ Друк / сертифікат</button><button class="btn secondary" data-action="close">Назад до роботи</button></div>`)}
function dl(file,content){let b=new Blob(['\ufeff'+content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=file;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function downloadSingle(){const c=scenario();if(run.phase!=='done'){showToast('Звіт доступний після завершення заявки.','bad');return}dl('SYSTEM_RESCUE_Заявка_'+(idx+1)+'.txt',['SYSTEM RESCUE — Інженерний звіт',`Учень: ${store.name||'Не зазначено'}`,`Заявка: ${c.title}`,`Дата: ${now()}`,`Оцінка: ${grade(run.score)}/12`,`Результат: ${run.score}/100`,`Час: ${seconds(Math.round((run.doneAt-run.started)/1000))}`,'',`Симптоми: ${c.description}`,'',`Докази: ${run.evidence.map(toolName).join('; ')}`,`Причина: ${c.diagnoses[c.cause]}`,`Рішення: ${c.fixes[c.repair]}`,`Контроль: ${c.service?'реєстрація передачі заявки у журналі подій':'повторна діагностика — '+toolName(c.verify)}`,'',`Важливо: ${c.lesson}`,'',`Помилки класифікації/діагнозу: ${run.wrongDiagnoses}`,`Помилки ремонту: ${run.wrongRepairs}`,`Непотрібні перевірки: ${run.wrongTest}`,`Підказки: ${run.hintPhases.length}`,'','Навчальна симуляція. Не змінює справжнього комп’ютера.'].join('\r\n'))}
function downloadAll(){dl('SYSTEM_RESCUE_Журнал_8_клас.txt',[`SYSTEM RESCUE — Журнал виконання`, `Учень: ${store.name||'Не зазначено'}`,`Дата: ${now()}`,'',...scenarios.map((c,i)=>`${String(i+1).padStart(2,'0')}. ${c.title} | Спроб: ${store.attempts[c.id]||0} | ${store.best[c.id]?store.best[c.id].grade+'/12':'не виконано'}`),'',`Виконано: ${countDone()}/${scenarios.length}`,`Досвід: ${badgeScore()} XP`].join('\r\n'))}
function openMissions(){modal(`<button class="cross" data-action="close">×</button><div class="eyebrow">ВИБІР ЗАЯВКИ</div><h2>🗂️ Відкриті інциденти</h2><p>Можна проходити заявки в довільному порядку. Для уроку зручно обрати декілька різних типів збоїв.</p><div class="mission-list" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-height:57vh;overflow-y:auto">${scenarios.map((c,i)=>`<button class="ticket ${store.best[c.id]?'complete':''}" data-case="${i}"><span class="index">${c.emoji}</span><span class="ticket-label"><b>${i+1}. ${clean(c.title)}</b><small>${c.kind}</small></span><span class="score">${store.best[c.id]?store.best[c.id].grade+'/12':'→'}</span></button>`).join('')}</div>`)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.case!==undefined){modal('');useCase(+d.case);return}if(d.tool){actTool(d.tool);return}if(d.triage){actTriage(d.triage);return}if(d.diagnosis!==undefined){actDiagnosis(+d.diagnosis);return}if(d.repair!==undefined){actRepair(+d.repair);return}if(d.path!==undefined){if(activeTool==='settings'&&+d.path===pathStep){pathStep++;tone('good');draw()}return}switch(d.action){case'scan':scan();break;case'hint':hint();break;case'theory':openTheory();break;case'missions':openMissions();break;case'newcase':useCase(idx);break;case'report':openReport();break;case'result':openResult();break;case'next':modal('');useCase((idx+1)%scenarios.length);break;case'close':modal('');break;case'begin':store.name=(document.getElementById('username')?.value||'').trim().slice(0,60);persist();modal('');draw();break;case'download':downloadSingle();break;case'downloadall':downloadAll();break;case'print':window.print();break;default:break}});
document.addEventListener('change',e=>{if(e.target.id==='adapter'){adapter=e.target.value;run.scanned.network=false;draw()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog)modal('');if(e.key==='Enter'&&document.activeElement?.id==='username'){store.name=document.getElementById('username').value.trim().slice(0,60);persist();modal('');draw()}});
run=newRun();draw();clockTimer=setInterval(updateClock,1000);let seen=false;try{seen=sessionStorage.getItem('system_rescue_started')==='1';sessionStorage.setItem('system_rescue_started','1')}catch(e){}if(!seen||!store.name)start();
})();
</script>
</body></html>
